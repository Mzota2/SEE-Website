<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/auth.css">
    <link rel="stylesheet" href="/index.css">
    <script src="https://kit.fontawesome.com/4aba7f41d8.js" crossorigin="anonymous"></script>
    <title>SEE-Register</title>
</head>
<body>
    <!-- Alert -->
     <div id="alert-box" class="">
        
     </div>

    <main class="auth-container">
        <div class="auth-image-container">
            <img class="auth-image" src="/assets/images/bak.jpg" alt="tele lines">
        </div>
        <!-- <div class="auth-lgradient"></div> -->
        <div class="auth-form-suspend auth-form-suspend-login">
            <div id="submit-form" class="see-auth-form see-column" action="">
                <div class="auth-form-title-container">
                    <img src="/assets/images/main-logo.jpg" alt="SEE LOGO" class="see-logo">
                    <h1 class="auth-form-title">Society of Electrical Engineers - MUBAS</h1>
                    <h2 class="auth-form-sub-title">VERIFYING ...</h2>
                </div>

                <div class="verification-status-container">
                    <p style="color: black;"><span id="verification-status"></span></p>
                    <div class="loader-container">
                        <div class="loader"></div>
                    </div>
                </div>

                <p class="verification-login-link">Click <a href="http://" target="_blank" rel="noopener noreferrer">here</a> to login</p>
    
    
            </div>
        </div>
        
    </main>
</body>
<script type="module" src="/js/helpers.js"></script>
<script type="module" src="/js/verification.js"></script>
</html>
